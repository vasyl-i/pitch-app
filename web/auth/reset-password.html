<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>PitchGym — Reset password</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #08070C;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    /* Atmospheric glow blobs — matches the app's AppBackground */
    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.35;
      pointer-events: none;
    }
    .glow-indigo {
      width: 340px; height: 340px;
      background: #7B7FE0;
      top: -80px; right: -60px;
    }
    .glow-lavender {
      width: 260px; height: 260px;
      background: #B79FE8;
      bottom: 10%; left: -40px;
    }
    .glow-lime {
      width: 200px; height: 200px;
      background: #C8DA59;
      top: 10%; right: 20%;
      opacity: 0.18;
    }
    .glow-coral {
      width: 180px; height: 180px;
      background: #EE8672;
      bottom: -40px; right: 10%;
      opacity: 0.2;
    }

    .card {
      position: relative;
      text-align: center;
      max-width: 400px;
      width: 100%;
      z-index: 1;
    }

    .icon {
      margin: 0 auto 24px;
      width: 96px;
      height: 96px;
      border-radius: 48px;
      background: rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      line-height: 48px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .subtitle {
      color: rgba(255,255,255,0.55);
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-block;
      background: #C8DA59;
      color: #08070C;
      font-weight: 700;
      font-size: 16px;
      padding: 16px 40px;
      border-radius: 999px;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.2s;
      box-shadow: 0 6px 24px rgba(200, 218, 89, 0.35);
    }
    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }

    .desktop-msg {
      display: none;
      color: rgba(255,255,255,0.4);
      font-size: 14px;
      margin-top: 20px;
      line-height: 1.5;
    }

    .footer {
      position: fixed;
      bottom: 24px;
      left: 0; right: 0;
      text-align: center;
      color: rgba(255,255,255,0.2);
      font-size: 12px;
      z-index: 1;
    }
  </style>
</head>
<body>
  <!-- Atmospheric glow blobs -->
  <div class="glow glow-indigo"></div>
  <div class="glow glow-lavender"></div>
  <div class="glow glow-lime"></div>
  <div class="glow glow-coral"></div>

  <div class="card">
    <div class="icon">&#128274;</div>

    <h1>Set your new password</h1>
    <p id="message" class="subtitle">Redirecting you to PitchGym...</p>
    <a id="open-app" class="btn" href="#">Open PitchGym</a>
    <p id="desktop-msg" class="desktop-msg"></p>
  </div>

  <div class="footer">PitchGym</div>

  <script>
    (function() {
      var fragment = window.location.hash || '';
      var deepLink = 'app.anya.eargym://auth/callback' + fragment;
      var openBtn = document.getElementById('open-app');
      var message = document.getElementById('message');
      var desktopMsg = document.getElementById('desktop-msg');

      openBtn.href = deepLink;

      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      if (isMobile) {
        window.location.href = deepLink;
      } else {
        message.textContent = 'Open the app on your phone to set a new password.';
        openBtn.style.display = 'none';
        desktopMsg.style.display = 'block';
        desktopMsg.textContent = 'Open PitchGym on your phone and tap the link in your email.';
      }
    })();
  </script>
</body>
</html>
